
<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मल्लविद्या विश्व वार्ता | HD Newspaper Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@600;700;800&family=Baloo+2:wght@700;800&family=Kadwa:wght@700;900&family=Martel:wght@700;900&family=Mukta:wght@600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Mukta', sans-serif;
            background-color: #f1f5f9;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Devanagari Masthead Calligraphy Fonts - Solid, unbroken connected strokes */
        .font-masthead-rozha {
            font-family: 'Rozha One', 'Martel', serif;
            font-weight: 400;
        }

        .font-masthead-baloo {
            font-family: 'Baloo 2', 'Mukta', cursive, sans-serif;
            font-weight: 800;
        }

        .font-masthead-kadwa {
            font-family: 'Kadwa', 'Martel', serif;
            font-weight: 900;
        }

        .font-masthead-mukta {
            font-family: 'Mukta', 'Anek Devanagari', sans-serif;
            font-weight: 800;
        }

        .calligraphy-title {
            font-family: 'Rozha One', 'Martel', serif;
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: 0px !important;
            word-spacing: 4px;
            text-rendering: optimizeLegibility;
            display: block;
            width: 100%;
        }

        .calligraphy-subtitle {
            font-family: 'Rozha One', 'Martel', serif;
            letter-spacing: 0.5px;
        }
        
        .newspaper-font {
            font-family: 'Martel', 'Anek Devanagari', serif;
            text-rendering: optimizeSpeed;
        }

        .headline-font {
            font-family: 'Mukta', 'Baloo 2', sans-serif;
            font-weight: 800;
            letter-spacing: 0 !important;
            line-height: 1.35;
        }
        
        .drop-cap {
            font-size: 3.8rem;
            line-height: 0.85;
            font-family: 'Rozha One', 'Mukta', sans-serif;
            font-weight: 800;
            display: inline-block;
            margin-right: 10px;
            float: left;
            color: #b32400;
        }

        @media print {
            .no-print { display: none !important; }
            #newspaper-clipping { border: none !important; box-shadow: none !important; width: 100% !important; }
        }
    </style>
